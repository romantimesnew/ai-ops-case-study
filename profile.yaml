    claim: "In production on 2 live client websites: 391 commits, 87 task cards, 79 committed reports in 17 days (2026-10-01 to 2026-10-17); of these, 142 commits, 25 cards and 25 reports in 2026-10-13 to 10-17."
    evidence: [docs/evidence.md, README.md]
  - id: direct_free_connectors
    claim: Set up Google Ads API and GA4 Data/Admin API access directly via own Google Cloud OAuth desktop client (no billing, Explorer tier), no paid connector service; secrets only on the agent machine. The OAuth app passed brand verification and was published (2026-10-16), so tokens no longer expire.
    evidence: [docs/connectors.md]
  - id: paid_search_hands_on
    claim: "Personally ran the client's Google Ads account from 04/2023 to 10/2026: ~172k account-currency lifetime spend, 53,114 clicks, 1.02M impressions, CTR 5.20%, avg CPC 3.24. It ran without working conversion tracking (0 primary conversions), which he later diagnosed himself."
    evidence: [docs/measurement-case.md, docs/evidence.md]
  - id: paid_search_audit
    claim: "API audit traced the 0 conversions to measurement (7 primary actions, 3 of them page views; GA4 0 key events, 51% of sessions from paid search). Waste: Display took 27.5% of spend and 88% of impressions in the 14 days before the fix (lifetime Display CTR 1.36% vs Search 6.08% in that campaign); ~10% of 90-day spend on irrelevant queries."
    evidence: [docs/measurement-case.md, docs/evidence.md]
  - id: baseline_before_after
    claim: "Baseline for evaluation: 14 days before the 2026-10-12 changes, CTR 1.47%, CPC 21.63, 194 clicks. After-data not yet available."
    evidence: [docs/measurement-case.md]
  - id: governed_changes
    claim: "Every ads write runs proposal, owner approval, validate_only dry run, apply, re-read, changelog. 9 logged change sets 2026-10-12 to 10-17: Display off, presence-only geo, shared negatives 51 -> 101, conversions restructured, GA4 key events and 3 custom dimensions, dead landing URLs fixed, RSAs expanded to 15 headlines / 4 descriptions and policy disapprovals fixed, 9 phrase-match keywords, schedule 07:00-24:00 daily with call assets in business hours."
    evidence: [docs/evidence.md, docs/measurement-case.md]
  - id: conversion_restructure
    claim: "Conversions restructured 2026-10-16: website form lead primary, phone click secondary, page views demoted; GA4 generate_lead and phone_click as key events with 3 custom dimensions (form location, link location, messenger)."
    evidence: [docs/measurement-case.md, docs/evidence.md]
  - id: tracking_implementation
    claim: "Agents shipped GA4 in a single tag loader, a host-guarded preview-only Meta Pixel, and lead events (form lead, phone click, messenger click) deployed on production 2026-10-16. Verified 2026-10-17 with one test lead and one test call: GA4 received both events and Google Ads recorded one test conversion each. Found by reading plugin source that suppressed mail still fires conversion events."
    evidence: [docs/measurement-case.md, examples/wordpress-mu-plugins/lead-events.php]
  - id: search_console_cleanup
    claim: Search Console cleaned up after the hosting hack (leftover spam sitemaps removed, domain property added, new sitemap submitted); 301s for 7 old URLs that still had search clicks.
    evidence: [README.md, examples/wordpress-mu-plugins/legacy-301-redirects.php]
  - id: second_site_delivery
    claim: "Second site (multi-specialty clinic) moved from read-only audit to delivery on 2026-10-17: preview copy with indexing closed, child-theme mirror in Git, own path-guarded REST plugin for theme files, client edit requests turned into cards, two-phase production release over REST; 15 cards and 15 reports that day."
    evidence: [README.md, docs/evidence.md, examples/wordpress-mu-plugins/theme-file-rest.php]
  - id: origin
    claim: Moved from manual ads and site edits to agents after a client site's hosting was hacked and the site was lost; rebuilt it from old backups with AI, then moved all work to agents. This explains the strict security, site passports and backup-before-change rules.
    evidence: [README.md]
  - id: transferable_pattern
    claim: The operating model (source-of-truth files, task cards, role-scoped rules, approval gates) is domain-neutral and published as templates.
    evidence: [templates/]

